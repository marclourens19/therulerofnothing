# Checks every new or edited comment on the chapter pages (giscus stores them
# in this repository's Discussions). A comment with a link or a blocked word is
# deleted, usually within a minute. Your own comments are never touched.
# The blocked words live in the repository secret BLOCKED_WORDS (Settings,
# Secrets and variables, Actions), where nobody else can read them.
name: Moderate comments

on:
  discussion_comment:
    types: [created, edited]

permissions:
  contents: read
  discussions: write

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/moderation
      - uses: actions/github-script@v7
        env:
          BLOCKED_WORDS: ${{ secrets.BLOCKED_WORDS }}
        with:
          script: |
            const moderate = require('./.github/moderation/moderate.js');
            await moderate({ github, context, core });
